<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineering Projects - Balanced Engineering</title>
  <link rel="stylesheet" href="../css/main.css">
  <!-- Page-specific inline styles for projects/terminal. Cleaned to remove invalid fragments. -->
  <style>
    :root { --bg:#0B0D10; --muted:#9fbfe6; --accent:#60A5FA; --panel-bg:linear-gradient(180deg, rgba(6,18,36,0.85), rgba(3,12,24,0.7)); }
    body { background-color: var(--bg); color:#E5E7EB; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin:0; }

    .projects-container { display:flex; align-items:flex-start; gap:10%; min-height:100vh; padding:100px 4rem 2rem 4rem; box-sizing:border-box; }

    .left-description { flex:0 0 30%; padding:2rem; box-sizing:border-box; }
    .left-description h1 { font-size:2.25rem; margin:0 0 0.75rem 0; font-weight:700; color:#E5E7EB; }
    .left-description h2 { font-size:1.25rem; margin:0 0 1rem 0; color:#93C5FD; font-weight:600; }
    .left-description p { margin:0 0 1rem 0; color:#D1D5DB; line-height:1.6; }

    .vault-container { flex:0 0 60%; padding:2rem; display:flex; align-items:flex-start; justify-content:center; box-sizing:border-box; }

    /* Vault (decorative) */
    .vault-outer { width:500px; height:500px; position:relative; border-radius:50%; background:linear-gradient(135deg,#2C5282,#1E3A8A); border:12px solid var(--accent); box-shadow:0 0 40px rgba(96,165,250,0.25), inset 0 0 20px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; }
    .vault-wheel{ width:200px; height:200px; border-radius:50%; background:linear-gradient(145deg,#3B82F6,#1E40AF); border:8px solid #93C5FD; display:flex; align-items:center; justify-content:center; }

    /* Projects revealed panel */
    .projects-revealed { position:absolute; inset:0; padding:2rem; border-radius:20px; background:rgba(11,13,16,0.94); color:#dbefff; display:flex; flex-direction:column; gap:1rem; overflow:auto; box-sizing:border-box; }

    .projects-list { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .project-item { background:rgba(30,58,138,0.45); padding:1rem; border-radius:8px; border:1px solid rgba(147,197,253,0.12); }
    .project-item h3{ margin:0 0 0.5rem 0; color:var(--accent); font-size:1.05rem; }
    .project-item p{ margin:0; color:#D1D5DB; font-size:0.95rem; }

    .project-tech { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.5rem; }
    .tech-tag{ font-size:0.7rem; padding:0.12rem 0.5rem; border-radius:4px; background:rgba(30,58,138,0.35); color:#93C5FD; border:1px solid rgba(147,197,253,0.08); }

    /* Inline project category list (one line) */
    .project-list-keys {
      display: flex;
      gap: 1.25rem;
      list-style: none;
      padding: 0;
      margin: 0;
      align-items: center;
      color: #D1D5DB;
      font-size: 0.85rem;
    }
    .project-list-keys li { display: inline-flex; align-items: center; gap: 0.5rem; }
    .project-list-keys li::before { content: ''; width: 6px; height: 6px; background: #60A5FA; border-radius: 50%; display:inline-block; }

    /* Terminal (visible panel) */
    .terminal-panel { position:relative; width:100%; height:520px; max-width:100%; background:var(--panel-bg); border-left:1px solid rgba(96,165,250,0.06); padding:44px 16px 16px; border-radius:8px; box-shadow:0 12px 40px rgba(2,6,23,0.6); color:#cfe8ff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace; overflow:auto; font-size:0.88rem; line-height:1.45; }
    .terminal-panel::-webkit-scrollbar{ width:0; height:0; }
    .terminal-panel{ scrollbar-width:none; -ms-overflow-style:none; }

    /* Mac-like terminal header (red/yellow/green window controls) */
    .terminal-navbar{
      position:absolute;
      top:12px;
      left:12px;
      display:flex;
      gap:8px;
      align-items:center;
      padding:6px 12px;
      min-width:72px;
      background: rgba(16,28,44,0.56);
      border-radius:999px;
      box-shadow: 0 8px 22px rgba(2,6,23,0.55), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(3px);
      z-index: 30;
      border: 1px solid rgba(255,255,255,0.02);
    }
    .terminal-navbar .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.35); }
    .terminal-navbar .red{ background:#ff5f56; }
    .terminal-navbar .yellow{ background:#ffbd2e; }
    .terminal-navbar .green{ background:#27c93f; }

    .panel-title{ color:#9ed0ff; font-weight:700; margin-bottom:10px; }
    .cmd-entry{ display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:6px; }
    .cmd-link{ color:#dbefff; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .prompt{ color:#7dd3fc; font-weight:700; }
    .project-name{ font-weight:700; }
    .cmd-meta{ color:var(--muted); font-size:0.85rem; }
    .cmd-links{ display:flex; gap:8px; align-items:center; margin-top:6px; }
    .meta-badge{ background: rgba(96,165,250,0.06); color:#9ed0ff; padding:4px 8px; border-radius:999px; font-size:0.78rem; }
    .repo-link{ display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:8px; background: rgba(255,255,255,0.02); border:1px solid rgba(96,165,250,0.04); color:#cfe8ff; text-decoration:none; }
    .repo-link svg{ width:18px; height:18px; fill:#cfe8ff; }

    /* small responsive tweaks */
    @media (max-width:1000px){ .projects-container{ flex-direction:column; padding:80px 1.5rem; } .left-description{flex:1 0 auto;} .vault-container{flex:1 0 auto; width:100%;} .terminal-panel{height:420px;} }
  </style>
</head>
<body> <!-- Main body element -->

  <!-- Navigation Bar -->
  <!-- Fixed top navigation consistent across all pages -->
  <nav class="navbar"> <!-- Semantic nav element -->
    <div class="nav-container"> <!-- Container for navbar content -->
      <!-- Brand link returns to home page -->
      <a href="../index.html/index.html" class="nav-brand">Balanced Engineering</a>
      
      <!-- Navigation links list -->
      <ul class="nav-links"> <!-- Unordered list of page links -->
        <li><a href="projects.html">Projects</a></li> <!-- Current page - Projects -->
        <li><a href="research.html">Research</a></li> <!-- Link to Research page -->
        <li><a href="leadership.html">Leadership</a></li> <!-- Link to Leadership page -->
        <li><a href="academics.html">Academics</a></li> <!-- Link to Academics page -->
        <li><a href="achievements.html">Achievements</a></li> <!-- Link to Achievements page -->
        <li><a href="balance.html">Balance</a></li> <!-- Link to Balance page -->
      </ul>
    </div>
  </nav>

  <!-- Main Projects Container -->
  <!-- Two-column layout: description (left) and vault (right) -->
  <main class="projects-container"> <!-- Main semantic element with custom class -->
    
    <!-- Left Section: Description -->
    <!-- Text explaining the projects and vault concept -->
    <section class="left-description"> <!-- Semantic section element -->
      <h1>Projects</h1> <!-- Main page heading -->
      
      <h2>Projects — Concise, Practical, Ready</h2>
      <p class="subheading">Browse real builds grouped by focus:</p>
      <ul class="project-list-keys">
        <li>Web Systems</li>
        <li>Data Projects</li>
        <li>Automation</li>
      </ul>
    </section> <!-- End left-description -->

    <!-- Right Section: Project command panel (terminal-style) -->
    <section class="vault-container"> <!-- Semantic section for terminal panel -->
      <div class="terminal-panel" id="terminalPanel" aria-label="Project command panel">
        <div class="panel-title">Project Vault</div>
        <!-- Entries will be rendered here by JS -->
      </div>
    </section>
  </main> <!-- End projects-container -->

  <!-- Dynamic Project Data & Renderer -->
  <script>
    /**
     * Project data source – edit this array to add / update projects.
     * Each object is rendered into a .project-item card inside the vault.
     */
    const PROJECTS = [
      { title: 'RushGrid', tech: [], description: 'Description coming soon.', repo: 'https://github.com/Lalitya31/RushGrid', deploy: 'https://rushgridfinal.vercel.app/' },
      { title: 'NeoPulse', tech: [], description: 'Description coming soon.', deploy: 'https://www.youtube.com/watch?v=qWQqcY_4Wjc' },
      { title: 'E.D.G.E', tech: [], description: 'Description coming soon.', repo: 'https://github.com/Lalitya31/E.D.G.E' },
      { title: 'GestALT', tech: [], description: 'Description coming soon.', repo: 'https://github.com/Lalitya31/GestALT', deploy: 'https://gest-alt.vercel.app/' },
      { title: 'Balanced Engineering Portfolio', tech: [], description: 'Description coming soon.', repo: 'https://github.com/Lalitya31/lalityadodla-portfolio' }
    ];

    /**
     * Render projects into the visible terminal-style panel on the right.
     * Each entry shows a command-like link, tech stack, project page link, and repo link (if available).
     */
    function renderTerminalPanel() {
      const panel = document.getElementById('terminalPanel');
      if (!panel) return;

      let html = '<div class="terminal-navbar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>';
      html += '<div class="panel-title">Project Vault — command list</div>';
      PROJECTS.forEach((p, i) => {
        const idx = i + 1;
        const cmdHref = `#proj-${idx}`;
        const repoHref = p.repo || '#';
        const deployHref = p.deploy || '';
        const pageHref = p.page || cmdHref;
        const techLine = (p.tech && p.tech.length) ? p.tech.join(' • ') : '';
        const techHtml = techLine ? `<div class="cmd-meta">${techLine}</div>` : '';
        const deployHtml = deployHref
          ? `<a class="meta-badge" href="${deployHref}" target="_blank" rel="noopener noreferrer" aria-label="Open deployment">↗</a>`
          : '';

        html += `
          <div class="cmd-entry">
            <a class="cmd-link" href="${pageHref}"><span class="prompt">&gt;</span><span class="project-name">${p.title}</span></a>
            ${techHtml}
            <div class="cmd-links">
              <a class="repo-link" href="${repoHref}" ${p.repo? 'target="_blank" rel="noopener noreferrer"' : ''} aria-label="GitHub">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.286-.01-1.04-.015-2.04-3.338.726-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.744.083-.729.083-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.467-2.382 1.235-3.222-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.912 1.23 3.222 0 4.61-2.805 5.625-5.475 5.92.435.375.81 1.096.81 2.215 0 1.6-.015 2.887-.015 3.28 0 .315.21.69.825.573C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
              </a>
              ${deployHtml}
            </div>
          </div>`;
      });

      panel.innerHTML = html;
    }

    // Populate terminal panel now
    renderTerminalPanel();
  </script>

  <!-- Interactive Features Script -->
  <!-- JavaScript file that adds interactivity to navbar and other features -->
  <script src="../js/interactions.js"></script> <!-- External JavaScript file -->

</body> <!-- End body -->
</html> <!-- End HTML document -->
