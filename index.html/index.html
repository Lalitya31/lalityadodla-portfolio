<!--
  Balanced Engineering Portfolio - Home Page
  
  Main landing page featuring a multi-layered visualization system
  representing different aspects of engineering excellence.
  
  The layout is split into two main sections:
  1) Left side: Personal branding with name, tagline, and contact links
  2) Right side: Interactive concentric circular layers representing:
     - Layer 1 (Core): Engineering Projects
     - Layer 2: Research & Publications
     - Layer 3: Leadership & Project Management
     - Layer 4: Academics
     - Layer 5: Achievements
     - Layer 6 (Outermost): Balance & Discipline
  
  Semantic HTML5 structure using main, section, article, nav, header, and footer.
  Interactive features powered by JavaScript (interactions.js).
  Clean and minimal design with modern CSS.
-->

    <!-- Right Section: Multi-Layer System Visualization -->
    <!-- Interactive concentric circles representing engineering layers -->
    <section class="right-section"> <!-- Semantic section for visualization area -->
      <div class="system-container"> <!-- Container for the concentric layer system -->
        
        <!-- Per-layer grouped components (layer + curved text) -->
        <!-- Each .layer-group contains the circular layer and its curved label so they rotate together -->
        
        <!-- Layer 6: Balance & Discipline (Outermost) -->
        <!-- Largest circle representing the foundation of everything -->
        
        <!-- Hidden checkbox for CSS-only interaction (not used with JavaScript) -->
        <input type="checkbox" id="layer-6" class="layer-toggle"> <!-- Checkbox ID corresponds to layer -->

        <div class="layer-group layer-group-6 rotate-cw-slow" data-layer="6">
          <a href="../pages/balance.html" class="layer layer-6" aria-label="Balance & Discipline" data-tip="Balance keeps performance sustainable."></a>
          <svg class="curved-text-svg local" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <path id="g6" d="M 250,20 A 230,230 0 1,1 249.9,20" fill="none"/>
            </defs>
            <text class="curved-label"><textPath href="#g6" startOffset="65%">BALANCE &amp; DISCIPLINE</textPath></text>
          </svg>
        </div>

        <!-- Second largest circle -->
